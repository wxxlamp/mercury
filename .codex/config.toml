default_permissions = "mercury"
approval_policy = "on-request"
approvals_reviewer = "user"
developer_instructions = """
公共工程任务使用当前仓库根目录，单片制作使用作者指定或根目录贴稿建档命令返回的项目目录。
本片下载的素材与参考放在该片目录。仓库外文件默认可读，凡需写入仓库外路径，先向作者说明目标并取得本次同意。
项目配置和技能可直接在仓库的 .codex/ 中读写。运行项目命令时，Python 使用仓库内的 .venv，Node.js 使用 .nvmrc 指定的已安装版本。
"""

# Keep writes tied to this checkout even when a session starts in a film subdirectory.
[permissions.mercury.filesystem]
":root" = "read"
"~/Movies/mercury" = "write"
"~/Movies/mercury/.codex" = "write"
"~/Movies/mercury/.git" = "read"
"~/Movies/mercury/.agents" = "read"
"~/Movies/mercury/.aws" = "read"

[permissions.mercury.network]
enabled = true

[[skills.config]]
name = "wangxingxing-text-to-video"
enabled = false
